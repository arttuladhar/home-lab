---
portainer_enabled: true
portainer_version: latest
portainer_stack_dir: /opt/stacks/portainer
portainer_http_port: 9000
portainer_https_port: 9443
portainer_agent_port: 8000
portainer_ports:
  - "{{ portainer_http_port }}:{{ portainer_agent_port }}"
  - "{{ portainer_https_port }}:9443"
portainer_timezone: America/Chicago
